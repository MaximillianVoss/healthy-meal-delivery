name: Ошибка
description: Воспроизводимая проблема без секретов и персональных данных
title: "[Ошибка] "
labels: []
body:
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      description: Опишите исходное состояние и действия
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый и фактический результат
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия и окружение
  - type: checkboxes
    id: privacy
    attributes:
      label: Проверка данных
      options:
        - label: Я удалил пароли, токены и личные данные из описания
          required: true
