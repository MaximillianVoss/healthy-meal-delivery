name: Repository checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  structure:
    name: repository-structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, immutable commit
      - name: Validate repository structure
        run: python3 scripts/validate_structure.py
